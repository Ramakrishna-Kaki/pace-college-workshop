<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page using Flexbox</title>

    <style>

        /* Universal Selector */
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        /* Flexbox on Body */
        body{

            display:flex;

            justify-content:center;

            align-items:center;

            height:100vh;

            background-color:#e6f2ff;

        }

        /* Login Box */
        .login-box{

            width:350px;

            background-color:white;

            padding:30px;

            border-radius:10px;

            box-shadow:0px 0px 15px rgba(0,0,0,0.3);

        }

        /* Heading */
        h1{

            text-align:center;

            margin-bottom:20px;

            color:#333;

        }

        /* Form Layout */
        form{

            display:flex;

            flex-direction:column;

        }

        /* Input Fields */
        input{

            padding:12px;

            margin-bottom:15px;

            border:1px solid gray;

            border-radius:5px;

            font-size:16px;

        }

        /* Login Button */
        button{

            padding:12px;

            background-color:#007BFF;

            color:white;

            border:none;

            border-radius:5px;

            font-size:18px;

            cursor:pointer;

            transition:0.3s;

        }

        button:hover{

            background-color:#0056b3;

        }

        /* Bottom Text */
        p{

            text-align:center;

            margin-top:20px;

        }

        a{

            text-decoration:none;

            color:#007BFF;

        }

        a:hover{

            text-decoration:underline;

        }

    </style>

</head>
<body>

    <div class="login-box">

        <h1>Login</h1>

        <form>

            <input type="text" placeholder="Enter Username">

            <input type="password" placeholder="Enter Password">

            <button type="submit">Login</button>

        </form>

        <p>
            Don't have an account?
            <a href="registration.html">Register</a>
        </p>

    </div>

</body>
</html>
